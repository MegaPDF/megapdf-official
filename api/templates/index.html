<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/admin-assets/css/admin.css" rel="stylesheet">
    <script>
        window.API_BASE_URL = '{{.apiUrl}}';
    </script>
</head>
<body class="bg-gray-50">
    <div id="admin-app">
        <!-- Loading Screen -->
        <div id="loading-screen" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-lg shadow-lg text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                <p class="text-gray-600">Loading admin panel...</p>
            </div>
        </div>

        <!-- Login Form (initially hidden) -->
        <div id="login-form" class="hidden min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
            <div class="max-w-md w-full space-y-8">
                <div>
                    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                        MegaPDF Admin Panel
                    </h2>
                    <p class="mt-2 text-center text-sm text-gray-600">
                        Please sign in to access the admin panel
                    </p>
                </div>
                <form class="mt-8 space-y-6" id="admin-login-form">
                    <div>
                        <label for="email" class="sr-only">Email address</label>
                        <input id="email" name="email" type="email" required 
                               class="relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                               placeholder="Email address">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Password</label>
                        <input id="password" name="password" type="password" required 
                               class="relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                               placeholder="Password">
                    </div>
                    <div>
                        <button type="submit" 
                                class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Sign in
                        </button>
                    </div>
                </form>
                <div id="login-error" class="hidden mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded"></div>
            </div>
        </div>

        <!-- Admin Panel (initially hidden) -->
        <div id="admin-panel" class="hidden">
            <!-- Sidebar -->
            <div class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900 transform transition-transform duration-300 ease-in-out lg:translate-x-0" id="sidebar">
                <div class="flex items-center justify-center h-16 bg-gray-800">
                    <h1 class="text-white text-xl font-bold">MegaPDF Admin</h1>
                </div>
                <nav class="mt-5 px-2">
                    <a href="#" data-page="dashboard" class="nav-item group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-300 hover:bg-gray-700 hover:text-white">
                        <i class="fas fa-tachometer-alt mr-4"></i>
                        Dashboard
                    </a>
                    <a href="#" data-page="users" class="nav-item group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-300 hover:bg-gray-700 hover:text-white">
                        <i class="fas fa-users mr-4"></i>
                        Users
                    </a>
                    <a href="#" data-page="settings" class="nav-item group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-300 hover:bg-gray-700 hover:text-white">
                        <i class="fas fa-cog mr-4"></i>
                        Settings
                    </a>
                    <a href="#" data-page="pricing" class="nav-item group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-300 hover:bg-gray-700 hover:text-white">
                        <i class="fas fa-dollar-sign mr-4"></i>
                        Pricing
                    </a>
                    <a href="#" data-page="tools" class="nav-item group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-300 hover:bg-gray-700 hover:text-white">
                        <i class="fas fa-tools mr-4"></i>
                        PDF Tools
                    </a>
                    <a href="#" id="logout-btn" class="group flex items-center px-2 py-2 text-base font-medium rounded-md text-gray-300 hover:bg-gray-700 hover:text-white mt-8">
                        <i class="fas fa-sign-out-alt mr-4"></i>
                        Logout
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="lg:pl-64 flex flex-col flex-1">
                <!-- Top Bar -->
                <div class="sticky top-0 z-10 bg-white shadow">
                    <div class="flex items-center justify-between h-16 px-4">
                        <button id="sidebar-toggle" class="lg:hidden text-gray-500 hover:text-gray-900">
                            <i class="fas fa-bars"></i>
                        </button>
                        <div class="flex items-center space-x-4">
                            <span class="text-gray-700">Welcome, Admin</span>
                        </div>
                    </div>
                </div>

                <!-- Page Content -->
                <main class="flex-1 p-6">
                    <div id="page-content">
                        <!-- Dynamic content will be loaded here -->
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- Scripts -->
    <script src="/admin-assets/js/utils/helpers.js"></script>
    <script src="/admin-assets/js/utils/notifications.js"></script>
    <script src="/admin-assets/js/utils/validation.js"></script>
    <script src="/admin-assets/js/api.js"></script>
    <script src="/admin-assets/js/auth.js"></script>
    <script src="/admin-assets/js/components/charts.js"></script>
    <script src="/admin-assets/js/components/dashboard.js"></script>
    <script src="/admin-assets/js/components/users.js"></script>
    <script src="/admin-assets/js/components/settings.js"></script>
    <script src="/admin-assets/js/components/pricing.js"></script>
    <script src="/admin-assets/js/components/tools.js"></script>
    <script src="/admin-assets/js/admin.js"></script>
</body>
</html>
